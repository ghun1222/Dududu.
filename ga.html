<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luvu</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
    </style>
</head>
<body>

    <!-- 🌟 SOUNDTRACK (SoundCloud Embed – Auto Play) -->
    <iframe id="scPlayer" 
        width="0" height="0" 
        scrolling="no" frameborder="no" allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/1708-ph-m-h-u-vi-t/phep-mau-dan-ca-go-ost-maydays-ft-minh-toc&auto_play=true&loop=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false">
    </iframe>

    <script>
        // Fallback để auto-play khi mobile chặn
        document.addEventListener("touchstart", () => {
            const iframe = document.getElementById("scPlayer");
            iframe.src = iframe.src; // reload để SoundCloud play
        }, { once: true });
    </script>

    <!-- THREE.JS + GALAXY CODE GIỮ NGUYÊN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const messages = [
            { text: "Đi kỉ yếu M.Phương nhá ❤️", color: "#FFD700", size: 1.0, isHeart: false },
            { text: "Yêu lăm lăm", color: "#FF69B4", size: 1.0, isHeart: false },
            { text: "Let's capture the memories", color: "#00FFFF", size: 1, isHeart: false },
            { text: "You are the bét yay", color: "#00FFFF", size: 1, isHeart: false },
            { text: "Mãi bên nhau bạn nhé", color: "#FFFFFF", size: 1, isHeart: false },
            { text: "💖", color: "#FF1493", size: 1.5, isHeart: true },
            { text: "✨", color: "#FFFF00", size: 1.0, isHeart: true },
            { text: "💕", color: "#FF69B4", size: 1.5, isHeart: true },
            { text: "❣️", color: "#FF0000", size: 1.2, isHeart: true }
        ];

        const PARTICLE_COUNT = 150;
        const FONT_FAMILY = 'Montserrat, sans-serif';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.03);
        const camera = new THREE.PerspectiveCamera(
            75, window.innerWidth / window.innerHeight, 0.1, 1000
        );
        camera.position.set(0, 5, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        function createTextTexture(message, color, isHeart) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const fontSize = isHeart ? 120 : 60;

            canvas.width = isHeart ? 300 : 1000;
            canvas.height = 300;

            context.font = `Bold ${fontSize}px ${isHeart ? 'serif' : FONT_FAMILY}`;
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.shadowColor = color;
            context.shadowBlur = 30;
            context.fillText(message, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        const floatingTexts = [];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const item = messages[Math.floor(Math.random() * messages.length)];

            const material = new THREE.SpriteMaterial({
                map: createTextTexture(item.text, item.color, item.isHeart),
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            const sprite = new THREE.Sprite(material);

            const scaleFactor = item.size * 3;
            const aspectRatio = item.isHeart ? 1 : 3.5;
            sprite.scale.set(aspectRatio * scaleFactor, scaleFactor, 1);

            const radius = 8 + Math.random() * 20;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 15;
            const speed = (0.2 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1) * 0.02;

            sprite.userData = {
                radius, angle, y, speed,
                baseOpacity: 0.5 + Math.random() * 0.5
            };

            scene.add(sprite);
            floatingTexts.push(sprite);
        }

        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const positions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 100;
        }

        starsGeometry.setAttribute('position',
            new THREE.BufferAttribute(positions, 3)
        );

        const starMaterial = new THREE.PointsMaterial({
            size: 0.1, color: 0xffffff, transparent: true, opacity: 0.8
        });

        const starMesh = new THREE.Points(starsGeometry, starMaterial);
        scene.add(starMesh);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            floatingTexts.forEach(s => {
                const blink = Math.sin(elapsedTime * 5 + s.userData.angle * 2) * 0.2 + 0.8;
                s.material.opacity = s.userData.baseOpacity * blink;

                s.userData.angle += s.userData.speed;
                s.position.x = Math.cos(s.userData.angle) * s.userData.radius;
                s.position.z = Math.sin(s.userData.angle) * s.userData.radius;
                s.position.y = s.userData.y + Math.sin(elapsedTime * 0.5 + s.userData.angle);
            });

            starMesh.rotation.y += 0.0005;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
